      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8090:8090"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      autor-service:
        condition: service_started
      libro-service:
        condition: service_started
      usuario-service:
        condition: service_started

volumes:
  mysql_data:
